name: 🚀 Build, Push & Deploy egoras-web

on:
  push:
    branches:
      - deploy     # Trigger only from this branch
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Kubernetes
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ghcr.io/dhive-protocol/egoras-com:latest
      DEPLOYMENT_FILE: k8s/egoras-web.yaml

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2️⃣ Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: |
          # Use npm ci if package-lock.json exists, otherwise fallback to npm install
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit
          else
            npm install --prefer-offline --no-audit
          fi

      # 4️⃣ Build CRA production app
      - name: Build Create React App
        run: npm run build

      # 5️⃣ Authenticate with GitHub Container Registry
      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 6️⃣ Build & push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          platforms: linux/amd64

      # 7️⃣ Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      # 8️⃣ Configure Kubernetes access
      - name: Configure Kubernetes access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config 
          chmod 600 ~/.kube/config
          kubectl cluster-info

      # 9️⃣ Apply Kubernetes manifests
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f ${{ env.DEPLOYMENT_FILE }}
          kubectl rollout status deployment/egoras-web --timeout=120s

      # 🔟 Verify Deployment
      - name: Verify deployment
        run: |
          kubectl get pods -l app=egoras-web -o wide
          kubectl get svc egoras-web-service -o wide
