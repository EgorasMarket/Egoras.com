name: 🚀 Build, Push & Deploy egoras-web

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Kubernetes
    runs-on: [self-hosted, control-plane]

    env:
      IMAGE_NAME: ghcr.io/dhive-protocol/egoras-com
      DEPLOYMENT_NAME: egoras-web
      CONTAINER_NAME: egoras-web
      DEPLOYMENT_FILE: k8s/egoras-web.yaml

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Set image tag (commit SHA)
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      # 3️⃣ Authenticate with GHCR
      - name: Authenticate with GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 4️⃣ Build & push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          platforms: linux/amd64

      # 5️⃣ Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      # 6️⃣ Configure Kubernetes access
      - name: Configure Kubernetes access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      # 7️⃣ Deploy (safe for create + update)
      - name: Deploy to Kubernetes
        run: |
          set -e

          echo "Applying base manifests..."
          kubectl apply -f ${{ env.DEPLOYMENT_FILE }}

          echo "Updating deployment with exact image version..."
          kubectl set image deployment/${{ env.DEPLOYMENT_NAME }} \
            ${{ env.CONTAINER_NAME }}=${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

          echo "Waiting for rollout..."
          kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} --timeout=300s

          echo "✅ Deployment completed."

      # 8️⃣ Verify Deployment
      - name: Verify deployment
        run: |
          kubectl get pods -l app=egoras-web -o wide
          kubectl get svc egoras-web-service -o wide