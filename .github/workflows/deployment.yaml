name: 🚀 Build, Push & Deploy egoras-web

on:
  push:
    branches:
      - deploy # Trigger only from this branch
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Kubernetes
    runs-on: [self-hosted, control-plane] # ✅ Use only control-plane runner

    env:
      IMAGE_NAME: ghcr.io/dhive-protocol/egoras-com:latest
      DEPLOYMENT_FILE: k8s/egoras-web.yaml

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2️⃣ Authenticate with GitHub Container Registry
      - name: Authenticate with GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      # 3️⃣ Build & push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          platforms: linux/amd64

      # 4️⃣ Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "latest"

      # 5️⃣ Configure Kubernetes access
      - name: Configure Kubernetes access
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl cluster-info

      # # 6️⃣ Apply Kubernetes manifests
      # - name: Deploy to Kubernetes
      #   run: |
      #     kubectl apply -f ${{ env.DEPLOYMENT_FILE }}
      #     kubectl rollout status deployment/egoras-web --timeout=120s

      # 6️⃣ Deploy to Kubernetes (safe)
      - name: Deploy to Kubernetes
        run: |
          set -e

          echo "Checking Kubernetes access..."
          kubectl version

          echo "Applying manifest to ensure all resources exist or are updated..."
          kubectl apply -f ${{ env.DEPLOYMENT_FILE }}

          echo "Updating image to newly built version..."
          kubectl set image deployment/cube-chat cube-chat=$IMAGE_NAME

          echo "Monitoring rollout..."
          kubectl rollout status deployment/cube-chat --timeout=300s

          echo "✅ Deployment completed."

      # 7️⃣ Verify Deployment
      - name: Verify deployment
        run: |
          kubectl get pods -l app=egoras-web -o wide
          kubectl get svc egoras-web-service -o wide
